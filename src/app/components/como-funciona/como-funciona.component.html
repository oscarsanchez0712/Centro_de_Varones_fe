<section class="cf">
  <div class="cf-wrap">
    <h2>¿Cómo funciona?</h2>
    <ol class="cf-lista">
      @for (p of pasos; track p.numero; let i = $index) {
        <li class="cf-paso" [style.--i]="i">
          <span class="cf-icono"><svg viewBox="0 0 24 24" width="26" height="26" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path [attr.d]="p.d"/></svg></span>
          <span class="cf-num">{{ p.numero }}</span>
          <h3>{{ p.titulo }}</h3>
          <p>{{ p.descripcion }}</p>
        </li>
      }
    </ol>
  </div>
</section>
