<section class="bg-gray-50">
  <div class="max-w-[1100px] mx-auto px-4 sm:px-6 py-14">
    <h2 class="text-2xl sm:text-3xl font-bold text-blue-900 text-center mb-10">¿Cómo funciona?</h2>

    <div class="grid gap-6 sm:grid-cols-2 md:grid-cols-3">
      @for (paso of pasos; track paso.numero) {
        <div class="bg-white rounded-2xl shadow-sm border border-gray-100 p-6 text-center hover:shadow-md transition-shadow">
          <div class="text-3xl font-extrabold text-blue-100 mb-1">{{ paso.numero }}</div>
          <div class="text-3xl mb-3">{{ paso.icono }}</div>
          <h3 class="font-semibold text-blue-900 text-lg mb-2">{{ paso.titulo }}</h3>
          <p class="text-gray-600 text-sm">{{ paso.descripcion }}</p>
        </div>
      }
    </div>
  </div>
</section>
