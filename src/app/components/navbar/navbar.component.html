<header class="nav no-imprimir">
  <div class="nav-barra">
    <a routerLink="/" fragment="inicio" class="nav-marca" (click)="cerrarMenu()">
      <img src="logo.jpg" alt="Escudo de la institución" class="nav-escudo">
      <span class="nav-textos">
        <span class="nav-nombre">IEP N.° 20874</span>
        <span class="nav-gestion">Gestión 2026</span>
      </span>
    </a>

    <nav aria-label="Navegación principal" class="nav-enlaces">
      <a routerLink="/" fragment="inicio" (click)="cerrarMenu()">Inicio</a>
      <a routerLink="/matriculas" (click)="cerrarMenu()">Matrículas</a>
      <a routerLink="/notas" (click)="cerrarMenu()">Notas</a>
      <a routerLink="/consulta" (click)="cerrarMenu()" class="nav-cta">Consultar estado</a>
      <span class="nav-usuario">
        <span class="nav-avatar" aria-hidden="true">{{ auth.sesion?.nombre?.charAt(0) }}</span>
        <span class="nav-usuario-datos"><strong>{{ auth.sesion?.nombre }}</strong><small>{{ auth.sesion?.rol }}</small></span>
        <button type="button" (click)="cerrarSesion()" class="nav-salir">Salir</button>
      </span>
    </nav>

    <button type="button" (click)="toggleMenu()" class="nav-burger" aria-label="Abrir menú" [attr.aria-expanded]="menuAbierto">
      <span></span><span></span><span></span>
    </button>
  </div>

  @if (menuAbierto) {
    <nav aria-label="Navegación móvil" class="nav-movil fade-in">
      <a routerLink="/" fragment="inicio" (click)="cerrarMenu()">Inicio</a>
      <a routerLink="/matriculas" (click)="cerrarMenu()">Matrículas</a>
      <a routerLink="/notas" (click)="cerrarMenu()">Notas</a>
      <a routerLink="/consulta" (click)="cerrarMenu()" class="nav-cta">Consultar estado</a>
      <button type="button" (click)="cerrarSesion()" class="nav-salir">Cerrar sesión ({{ auth.sesion?.nombre }})</button>
    </nav>
  }
</header>
