<section id="requisitos" class="rq">
  <div class="rq-wrap">
    <div class="rq-cabecera">
      <div>
        <h2>Requisitos para matrícula</h2>
        <p class="rq-sub">Marca los documentos que ya tienes a la mano.</p>
      </div>
      <div class="rq-avance" aria-live="polite">
        <strong>{{ listos.size }} de {{ requisitos.length }} listos</strong>
        <div class="rq-barra"><span [style.width.%]="porcentaje"></span></div>
        @if (listos.size === requisitos.length) { <em class="rq-listo">¡Todo listo para matricular!</em> }
      </div>
    </div>

    <div class="rq-grid">
      @for (r of requisitos; track r.titulo) {
        <button type="button" class="rq-card" [class.on]="listos.has(r.titulo)" [attr.aria-pressed]="listos.has(r.titulo)" (click)="alternar(r.titulo)">
          <span class="rq-icono"><svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path [attr.d]="r.d"/></svg></span>
          <span class="rq-texto"><b>{{ r.titulo }}</b><small>{{ r.descripcion }}</small></span>
          <span class="rq-check" aria-hidden="true"><svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12l5 5L20 7"/></svg></span>
        </button>
      }
    </div>
  </div>
</section>
